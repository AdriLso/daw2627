<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bordes Cuadros</title>
        <link rel="stylesheet" href="estilos.css">
    </head>
    <body id="cuerpo"> 
        <h1 style="margin-left:90px; margin-right: 115px; font-size: 60px; background-color: rgb(253, 219, 177); border-radius: 7px; padding: 20px; font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif ;"> Cuadros de la galería </h1>
        <div  id ="segundoCuerpo" style="display: flex;">
            <div style="margin-right: 100px; margin-left: 100px;">
                <h2 style=" font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif ;"> <b>El grito  </b></h2> <h3> Edvard Munch - 1893</h3>
                <br>
                <img id="grito" style="width: 474px" height="597px" src="elGrito.avif" alt="Cuadro 'El grito'">
                <br><br>
            </div>
            
            <div>
                <h2 style="font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif ;"> Flores </h2> <h3> Vincent VanGogh - 1886</h3>
                <br>
                <img id="flores" src="flores_vanGogh.webp" alt="Cuadro 'Las Flores'" style="border-image: url(daria-yakovleva-wood-2045380_640.jpg) 15 round;
">
            </div>

            <div style="margin-right: 100px; margin-left:100px;">
                <h2 style="font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif ;"> La mujer con sombrilla </h2> <h3> Claude Monet - 1875</h3>
                <br>
                <img id="sombrilla" style="width: 474px" height="597px" src="sombrilla_Monet.webp" alt="Cuadro 'La mujer con sombrilla'">
                <br><br>
            </div>  
        </div>
    </body>
